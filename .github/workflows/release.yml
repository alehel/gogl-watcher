name: Release

# Pushing a tag such as v1.2.3 publishes the Docker image and creates a
# GitHub release. The tagged commit must be on main; tags on other branches
# are rejected before anything is built.
on:
  push:
    tags:
      - "v*.*.*"

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that the tagged commit is reachable from main
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is on main."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Refusing to release."
            exit 1
          fi

  test:
    name: Test
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go vet ./...
      - run: go test ./...
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web

  publish:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 -> 1.2.3, 1.2, 1 and latest. A pre-release such as
          # v1.2.3-rc.1 only gets its exact version tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=gogl-watcher
            org.opencontainers.image.description=Keeps a complete offline copy of your GOG library
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Docker image

            ```
            docker pull ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ```

            Also tagged as:
            ```
            ${{ steps.meta.outputs.tags }}
            ```
