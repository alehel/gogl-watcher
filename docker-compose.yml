services:
  gogl-watcher:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: ghcr.io/alehel/gogl-watcher:${VERSION:-latest}
    container_name: gogl-watcher
    restart: unless-stopped
    # Run as the owner of the mounted directories so downloads are writable.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MOCK_GOG: ${MOCK_GOG:-0}
    volumes:
      - ${DATA_DIR:-./data}:/data          # database, settings, GOG token
      - ${LIBRARY_DIR:-./library}:/library # installers, one folder per game
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/status"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
