services:
  gogl-watcher:
    image: ghcr.io/alehel/gogl-watcher:latest
    restart: unless-stopped
    user: "1000:1000"          # owner of the two directories below
    ports:
      - "8080:8080"
    environment:
      TZ: UTC
      LOG_LEVEL: info
    volumes:
      - ./data:/data
      - ./library:/library
